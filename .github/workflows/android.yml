name: Build WebView APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle (Android)
        run: |
          git clone https://github.com/mat-sz/android-webview-app.git android-app
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/
          cp script.js android-app/app/src/main/assets/
          cd android-app
          
          # Выводим версию gradle для отладки
          ./gradlew -version
          
          # Собираем debug APK с отключенным lint-анализом
          ./gradlew assembleDebug -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinsAI-App
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
