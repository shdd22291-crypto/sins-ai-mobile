name: Build WebView APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Download WebView App Template
        run: |
          curl -L https://github.com/mat-sz/android-webview-app/archive/refs/heads/main.zip -o app.zip
          unzip -q app.zip
          mv android-webview-app-main android-app
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/
          cp script.js android-app/app/src/main/assets/

      - name: Build with Gradle (Android)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinsAI-App
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
